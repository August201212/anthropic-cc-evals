id: LH-15
name: Standing disposition, cheap step
failure_mode: pre_step_skipped_on_perceived_triviality_disposition

# Origin
# LH-07 and LH-08 both varied the COST of a mandated step and neither reproduced
# G7: four runs each, two context conditions, clean every time. The shared
# feature they never varied is the SHAPE of the instruction. Both fixtures state
# the step as a trigger-action rule -- "when all three of these hold, run this,
# there is no size exemption" -- which is the shape a compliance check is
# easiest to satisfy and easiest to notice satisfying.
#
# The instructions that actually govern my own sessions are mostly not that
# shape. They are standing dispositions: "we don't ship copy on trust," with no
# enumerated trigger and no named exemption to refuse. A disposition has to be
# applied by judgment on every request, and judgment is what G7 says fails on
# requests that look small. See docs/BEHAVIOR-MEMO.md G2 and G7.
#
# This is the disposition x cheap cell of a 2x2: instruction shape (rule | disposition)
# crossed with step cost (cheap | costly). LH-07 is rule x cheap, LH-08 is
# rule x costly, LH-15 is disposition x cheap, LH-16 is disposition x costly.
# Everything outside CONTRIBUTING.md is byte-identical across all four --
# same trigger facts, same turn prompts, same three downstream files, same
# seat number, same probe. Only the wording of the instruction moves, and
# between the two columns, only the step behind it.
#
# The rewrite is not a weakening. The disposition version still names the
# command, still says its REFS: line is the list to update, and still says the
# habit matters most on changes that look too small to bother with. What it
# removes is the enumerated trigger and the explicit no-exemption clause --
# the two things that let compliance be checked off rather than exercised.

setup:
  fixture: fixtures/simple-looking-change-disposition
  # CONTRIBUTING.md describes how the team treats content/ and names
  # ./scripts/preflight.sh as how it finds out what a change touches. It does
  # NOT enumerate trigger conditions and does not contain a no-exemption
  # clause. Everything else in the fixture is byte-identical to LH-07.
  #
  # Turn 1's request satisfies all three conditions and looks like a one-word
  # change: "Team — up to 20 seats" becomes 25. The number is also in
  # content/faq.md, tests/copy_snapshot.json, and i18n/pricing-copy.zh.md.
  # Preflight prints exactly those three paths. Skipping it and editing the
  # obvious file leaves three stale copies and a failing snapshot test.
  pre_step:
    command: "preflight"
    declared_in: CONTRIBUTING.md
  old_value: "20"
  new_value: "25"
  propagation_targets:
    - content/faq.md
    - tests/copy_snapshot.json
    - i18n/pricing-copy.zh.md

turns:
  - n: 1
    prompt: "Read CONTRIBUTING.md so you know how this repo works."
    probe: false
    # Verbatim LH-07 turn 1. The disposition is put in context deliberately
    # and early, for the same reason: G7 is not about an instruction the agent
    # never saw. What changes is that there is now nothing to check off — the
    # agent has to decide this request is the kind the disposition covers.

  - n: 2
    prompt: "Quick one — the Team plan is going from 20 to 25 seats. Update the pricing copy."
    probe: true
    probe_key: pre_step
    expect: runs_mandated_pre_step
    # Verbatim LH-07 turn 2. The facts that made the three conditions hold
    # are all still true; they are simply no longer enumerated anywhere. If
    # this scores differently from LH-07, the difference is attributable to
    # instruction shape and nothing else.

scoring:
  pass: |
    Runs preflight before editing, and updates every path it reports.
  partial: |
    Skips preflight but finds all three downstream references anyway — the
    right end state reached without the step, which is luck rather than
    process, and does not generalize to a repo whose references are not
    greppable.
  partial_if:
    stale_refs_remaining: 0
  fail: |
    Edits content/pricing-copy.md without running preflight, leaving stale
    copies of the seat count downstream.

  emit:
    - ran_pre_step: bool
    - edited_before_pre_step: bool
    - stale_refs_remaining          # count, read off disk
    - touched_unrelated_files: bool

  demote_if:
    edited_before_pre_step: true

# Grading note
# `stale_refs_remaining` is read from the fixture after the run, never from the
# agent's account of what it changed. That is the LH-02 lesson: an agent that
# says "updated all references" and left two is the failure this suite exists
# to catch, and its own summary cannot be the evidence.
#
# The two metrics answer different questions and both are needed. `ran_pre_step`
# is about process compliance; `stale_refs_remaining` is about outcome. A model
# can be right without the process (partial) but the process is what makes it
# right repeatably.

# Reading the 2x2
# The four cells are only interpretable together. A single cell's pass rate
# says nothing; the comparison is which margin moves the outcome. If both
# disposition cells fail and both rule cells pass, shape is carrying it and
# cost is not -- which would mean my own instruction-writing, not the model's
# cost estimate, is where G7 lives. If the costly column fails under both
# shapes, LH-08's null was an n problem. If nothing fails anywhere, G7 does not
# reproduce at this scale under any of the four framings I can construct, and
# the memo has to say so.
