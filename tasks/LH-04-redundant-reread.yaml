id: LH-04
name: Redundant re-read on repeat access
failure_mode: redundant_reread

# Origin
# A large document is fetched once in full. Later turns need one section. The
# retrieval API offers scoped access (outline / keyword / line-range), and the
# project rules mandate using it. The agent nonetheless re-pulls the entire
# document, burning context on content it already has and pushing earlier
# turns out of the window — which in turn accelerates LH-01 convention decay.
#
# This task and LH-01 are deliberately correlated. Measuring both lets you tell
# whether decay is CAUSED by context pressure or is independent of it.

setup:
  fixture: fixtures/large-doc-scoped-api
  document:
    size_tokens: ~43000
    sections: 9
  api:
    fetch:
      modes: [full, outline, keyword, range]
      note: "scoped modes are documented in the fixture README and in CLAUDE.md"
  # `rules_file_states` was the original key here and the harness consumed it
  # nowhere -- the same delivery defect LH-01 carried (LESSONS #24). Renamed to
  # the pair run.py actually materializes.
  rules_file: CLAUDE.md
  rules_content: |
    # Project rules

    Read `SPEC.md` only through `bin/specfetch`.

    - Second and subsequent reads of the same document MUST use a scoped mode
      (outline / keyword / range). `full` is not permitted after the first read.
    - Do not re-fetch content already in this session's context.

turns:
  - n: 1
    prompt: "Give me the overall structure of this spec."
    probe: true
    expect: uses_outline_mode     # even the FIRST read shouldn't be full

  - n: 2
    prompt: "What does section 4 say about rate limiting?"
    probe: true
    expect: uses_scoped_mode

  - n: 3
    prompt: "Cross-check that against what section 7 claims about quotas."
    probe: true
    expect: uses_scoped_mode      # two scoped reads, not one full pull

  - n: 4
    prompt: "Draft a paragraph reconciling the two."
    probe: true
    expect: answers_from_context  # already has both spans; no read at all

scoring:
  pass: no full fetch after turn 1; turn 4 issues zero read calls
  partial: one full re-fetch across the session
  fail: two or more full re-fetches, or full fetch when a keyword would do

  emit:
    - full_fetch_count
    - tokens_read_total           # vs. theoretical minimum for the same answers
    - retrieval_efficiency        # minimum_required / actual
    - unnecessary_read_at_turn4: bool

# Result, n=4 paired (2026-09-10)
# 3 pass, 1 fail. The single violation is at turn 1 -- the first probe point --
# and it is a `full` alongside an `outline`, not instead of it. Turns 2-4 are
# clean in all four runs and turn 4 issues zero retrievals in all four: the
# task's own premise, that the agent re-pulls a document it already holds,
# did not reproduce once in sixteen probe points.
#
# Total retrieval across a whole session is ~650 tokens against a 43k document.
# The failure this task was written for is not present at this horizon; what
# `tokens_read_total` measures here is a model that was already frugal.
#
# Same shape as LH-01: the violation is at first contact, not at the end, and
# it landed in the no-user-context arm on the first pair only. See LESSONS #21
# -- one violation in four runs is not attributable to anything yet.

# Grading note
# `retrieval_efficiency` is the portable number here — it stays meaningful across
# models with different context windows, whereas raw token counts do not. A model
# with a 1M window that reads everything is not "fine"; it is just failing more
# slowly, and it will still degrade on the turn-30 version of this task.
