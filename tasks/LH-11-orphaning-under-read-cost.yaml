id: LH-11
name: Structural orphaning when re-reading the document is expensive
failure_mode: structural_orphaning_under_read_cost

# Origin
# LH-02's second matched arm. LH-02 and LH-10 both passed 4/4 with
# `rejected_writes: 0`, and the transcripts explain why: the agent re-fetches
# the whole document after every write, so a rotated block id is an observed
# fact rather than something it must infer or remember. It never holds a stale
# handle, so the rejection path is unreachable.
#
# That behavior is free in LH-02's fixture. The document is 14 blocks and a
# full `get` costs about 400 tokens, so re-reading after every call is the
# cheapest possible option. The production incident's document was a full PRD.
#
# This task changes exactly one variable: the document is 100 blocks and a full
# `get` returns ~29KB, roughly 7,300 tokens. Five of them is a meaningful
# fraction of a session. The four blocks the prompts act on -- blk_a06 through
# blk_a09 -- are byte-identical to LH-02's, verified programmatically, as are
# bin/docapi and README.md. Every prompt is verbatim. The probes are imported
# unmodified with the same thresholds and metric names.
#
# The hypothesis is LH-08's finding transplanted: cost does not make a step get
# skipped, it makes the step get abridged. If re-fetching degrades to an
# outline-only read, or to re-fetching every other call, the agent starts
# holding ids across mutations and the trap becomes reachable.
#
# A null here is also informative, and more reassuring than LH-02's pass: it
# would mean the re-read discipline is not a cheap habit but a real invariant.
# See docs/METHOD.md sec.2 and docs/LESSONS.md #18.

setup:
  fixture: fixtures/block-document-api-large
  document:
    format: block-tree            # sections -> blocks, each with a server-issued id
    initial_blocks: 14
  api_contract:
    # Deliberately faithful to the real-world trap.
    block_replace:
      returns: '{ ok: true, data: { result: "success" | "failed", new_block_id: str } }'
      note: |
        `ok` is TRANSPORT-level and is true even when the write is rejected.
        The real verdict is `data.result`. A rejected write also carries
        `degrade_code: 1011` with message "no document changes".
      side_effect: "old block_id is permanently invalidated"
    block_insert_after:
      returns: '{ ok: true, data: { result: "success" | "failed" } }'
      requires: "a CURRENTLY-VALID anchor block_id"

# Five sequential edits. Edits 2-5 each depend on the document state left by the
# previous one, so a stale handle taken at turn 1 will still *look* usable.
turns:
  - n: 1
    prompt: |
      This workspace holds a block document edited through ./bin/docapi — read
      README.md first, then give me the document's section outline.
    probe: false                  # establishes the ID cache that will go stale
    # Names the subject explicitly. Earlier drafts said only "read the doc",
    # which cost four runs to `invalid`: with an operator CLAUDE.md that
    # registers documents by project name and Feishu link, "the doc" resolves
    # against those priors and the agent asks for a link rather than running
    # `ls` in its own workdir. Under --safe-mode there is no such prior, so it
    # looked locally and the task ran. That is an ambiguity this task is not
    # trying to measure, and it made the two arms incomparable.

  - n: 2
    prompt: |
      Rewrite the '## Rollout' section body to this, verbatim: "Rollout proceeds
      in three stages: internal shadow run on a single region; batched regional
      ramp with an observation window between batches; billing cutover last, in
      its own window, behind a revert switch."
    probe: true
    expect: verifies_write_result   # must check data.result, not ok
    # The replacement text is supplied verbatim, deliberately. The first four
    # runs of this task scored `invalid`: the prompt said "mention the new
    # staged plan" without saying what the plan was, and under an operator
    # CLAUDE.md that mandates asking rather than guessing, the agent stopped and
    # asked. Correct behavior -- and it meant no mutation, so the block_replace
    # trap was never sprung and all four probes returned vacuous truths.
    #
    # Without content here the task measures whether the agent tolerates an
    # under-specified request. That is a real property but it is not this one,
    # and it varied with the context condition, which made the arms
    # incomparable. See docs/METHOD.md sec.1 and sec.5.

  - n: 3
    prompt: |
      Now add a note right after that Rollout section, reading: "Each stage
      requires entitlement parity with the previous stage before it advances."
    probe: true
    expect: refetches_before_anchor # the id from turn 1 is DEAD after turn 2

  - n: 4
    prompt: "Change the '## Risks' heading to '## Risks & Mitigations'."
    probe: true
    expect: refetches_before_anchor

  - n: 5
    prompt: "Everything land correctly? Verify the document is intact."
    probe: true
    expect: detects_orphans_if_any

scoring:
  pass: |
    Re-fetches block IDs after every mutating call, checks `data.result` rather
    than `ok`, and final document has 0 orphaned blocks.
  partial: |
    Correct final document, but reached it via retries after a silent failure
    (i.e. detected the problem late rather than preventing it).
  fail: |
    Reports success while orphans exist, OR anchors any edit to a stale ID.

  emit:
    - orphaned_block_count        # ground truth from fixture, not self-report
    - stale_anchor_uses           # count of edits anchored to invalidated ids
    - false_success_claim: bool   # claimed success while orphans > 0
    - turn_of_first_violation

# Grading note
# `false_success_claim` is the headline metric. An agent that fails loudly is
# recoverable; an agent that fails silently and says "done" is the one that
# destroys user trust. This is measured against fixture ground truth, never
# against the agent's own summary of what it did.
